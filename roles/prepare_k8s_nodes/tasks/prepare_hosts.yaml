---
- name: Waiting till all master and worker nodes be available via SSH, check each 10
  wait_for:
    host: "{{ item }}"
    port: 22
    sleep: 10
    delay: 10
    timeout: 600
  loop: "{{ nodes }}"
  delegate_to: dvm

- name: "check availability for log"
  ansible.builtin.ping:

# ---------------------------------------------------------------- DNS (Astra: resolv.conf)
- name: Set DNS servers in /etc/resolv.conf
  replace:
    path: /etc/resolv.conf
    regexp: '^nameserver\s+{{ def_dns | regex_escape }}\s*$'
    replace: "nameserver {{ env_dns1 }}\nnameserver {{ env_dns2 }}"

# ---------------------------------------------------------------- Docker repo (containerd.io)
- name: Create /etc/apt/keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: repodocker

- name: Download Docker's official GPG key (Debian)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/dockergpg
    mode: '0644'
  tags: repodocker

- name: dearmor docker gpg
  shell: |
    gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/dockergpg
  changed_when: false
  tags: repodocker

- name: Add the docker apt repository - for containerd.io
  ansible.builtin.apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable
    state: present
    filename: docker
    update_cache: true
  tags: repodocker

# ---------------------------------------------------------------- Packages
- name: Install required packages
  apt:
    update_cache: true
    name: "{{ item }}"
    state: present
  loop:
    - rsync
    - sshpass
    - whois               # required for 'mkpasswd' command
    - python3-pip         # required to install kubernetes python package
    - containerd.io
    - apt-transport-https # required for kubeadm
    - ca-certificates     # required for kubeadm
    - curl                # required for kubeadm
    - jq

- name: Install kubernetes python package
  ansible.builtin.pip:
    name: "{{ item }}"
    extra_args: --break-system-packages   # PEP 668 on Debian 12
  loop:
    - kubernetes
    - yq

# ---------------------------------------------------------------- SWAP
- name: disable swap now
  command: swapoff -a
  changed_when: false

- name: comment out active swap entries in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1'

# ---------------------------------------------------------------- containerd / kernel
- name: create required directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - /etc/containerd

- name: copy additional config for loaded modules
  copy:
    src: "./files/load.d_k8s.conf"
    dest: "/etc/modules-load.d/k8s.conf"

- name: copy additional kernel params config file
  copy:
    src: "./files/sysctl.d_k8s.conf"
    dest: "/etc/sysctl.d/k8s.conf"

- name: copy containerd config file
  copy:
    src: "./files/containerd_config.toml"
    dest: "/etc/containerd/config.toml"

- name: apply kernel parameters changes
  shell: |
    modprobe overlay
    modprobe br_netfilter
    sysctl --system

- name: restart containerd
  systemd:
    state: restarted
    daemon_reload: true
    name: containerd
